<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Help shape the Ottawa Blockchain reboot. One minute, mostly taps.">
<meta property="og:title" content="Ottawa Blockchain is rebooting">
<meta property="og:description" content="Help us shape it. One minute, mostly taps.">
<meta property="og:image" content="https://ottawablockchain.ca/logo.png">
<title>Ottawa Blockchain: Help Shape the Reboot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#E8DED3" id="themecolor">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/forms/_engine/form.css">
</head>
<body>

<script src="/forms/_engine/form.js"></script>
<script>
/* ============================================================
   SETUP: paste your Google Apps Script web app URL here.
   Leave it empty to run in preview mode (nothing is saved).
   ============================================================ */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwvLLvmOgIyzbSawOnThQ9NexH_YARmPzKX4tiw3tYOioKhWRd646y7BiohjqG0XwsR/exec";

const OTHER = OBC.OTHER;

/* Option format: [emoji or icon name, value, extras]
   extras.hot   -> red "Hot" tag
   extras.ask   -> picking it opens a text box with this placeholder (saved to <id>_other)
   extras.note  -> small grey line under the label
   extras.tags  -> "v" virtual, "p" in person (both = hybrid)
   Reorder questions by moving them around in STEPS. */
const STEPS = [
  { id: "intro", type: "intro", theme: "red" },

  { id: "reach", type: "multi", q: "Where do you prefer getting Ottawa Blockchain updates?", hint: "Select all that apply",
    opts: [["substack", "Substack / email"], ["discord", "Discord"], ["instagram", "Instagram"], ["linkedin", "LinkedIn"],
           ["x", "X"], ["telegram", "Telegram"], ["whatsapp", "WhatsApp"], OTHER] },

  { id: "role", type: "single", q: "What are you closest to?",
    opts: [["🛠", "Builder", { note: "Developers, engineers, founders" }],
           ["💼", "Business", { note: "Finance, operations, investors" }],
           ["🎨", "Creator", { note: "Content, media, community" }],
           ["🏛", "Policymaker", { note: "Government, policy, law" }]] },

  { id: "level", type: "single", q: "Your experience with blockchain?",
    opts: [["🐣", "Just getting started"], ["🙂", "I know the basics"], ["🧠", "I work or build in it"]] },

  { id: "want", type: "multi", max: 3, q: "What would you like to see from Ottawa Blockchain?", hint: "Pick up to 3",
    opts: [["📚", "Learn the fundamentals"], ["🏛", "Understand policy & regulation"], ["📰", "Stay on top of news"],
           ["🤝", "Meet people in the space"], ["💼", "Find jobs & opportunities"], ["🛠", "Build projects"], OTHER] },

  { id: "topics", type: "multi", max: 3, q: "Which topics?", hint: "Pick up to 3",
    opts: [["🪙", "Stablecoins", { hot: 1 }], ["🍁", "Canadian regulation & policy", { hot: 1 }],
           ["🏦", "Tokenization"], ["🤖", "AI x blockchain"], ["₿", "How Bitcoin works"],
           ["⛓", "Ethereum, Solana & other chains"], ["🔁", "DeFi"], OTHER] },

  { id: "when", type: "when", q: "When works best for sessions and meetups?", hint: "Tap all that work · Ottawa time (ET)" },

  { id: "kinds", type: "multi", ranked: true, q: "What would you show up for?", hint: "Tap in order of priority: your favourite first",
    opts: [["🎤", "Founder & guest talks", { tags: ["v", "p"] }],
           ["📰", "News roundup", { tags: ["v"] }],
           ["💡", "Explainers & readings", { note: "Concepts and white papers", tags: ["v"] }],
           ["🏛", "Policy discussions", { tags: ["v", "p"] }],
           ["🛠", "Workshops & demos", { tags: ["v", "p"] }],
           ["🍻", "Meetups & socials", { tags: ["p"] }],
           OTHER] },

  { id: "volunteer", type: "single", theme: "red", q: "We're looking for volunteers. Are you in?",
    sub: "Help us reboot Ottawa Blockchain.",
    opts: [["🔥", "Core team", { note: "Weekly team call · about 2 hrs a week" }],
           ["📅", "Event crew", { note: "Only when we run an event" }],
           ["🤔", "Tell me more"], ["👋", "Not right now"]] },

  { id: "contact", type: "contact", when: a => isVolunteer(a) },

  { id: "help", type: "multi", q: "What would you want to help with?", hint: "Pick any. Every bit helps.",
    when: a => isVolunteer(a),
    opts: [["🧭", "Advisor"], ["📣", "Marketing & socials"], ["✍️", "Newsletter"],
           ["🎙", "Hosting sessions & events"], ["🎨", "Design, merch & website"],
           ["📷", "Photography & videography"], OTHER] },

  { id: "camera", type: "single", q: "Do you have a camera?",
    when: a => isVolunteer(a) && (a.help || []).includes("Photography & videography"),
    opts: [["📷", "Yes, a camera"], ["📱", "Just my phone"], ["🙅", "No"]] },

  { id: "newsletter", type: "newsletter" },
  { id: "done", type: "done", theme: "red" },
];

function isVolunteer(a) { return a.volunteer && a.volunteer !== "Not right now"; }

OBC.start({
  endpoint: ENDPOINT,
  steps: STEPS,
  text: {
    footer: "Takes about a minute. No typing unless you want to.",
    intro: {
      kicker: "Community survey · 1 minute",
      title: "Ottawa Blockchain is rebooting.",
      sub: "Help us shape it. A few taps on what you care about and what you'd actually show up for. You don't need to be in Ottawa.",
      teaser: { chip: "Coming up", text: "<b>Our first virtual Founder Call.</b> Fill this out and you'll be first to hear." },
    },
    contact: { kicker: "Volunteer", title: "Awesome. How do we reach you?", sub: "Fill in what you're comfortable with." },
    newsletter: { title: "Want the newsletter?", sub: "A monthly roundup of the latest news, on Substack. Optional." },
    done: {
      title: "Thanks.<br>You're in.",
      sub: "We'll share what everyone said, and you'll be first to hear about the Founder Call.",
      teaser: { chip: "Next", text: "Keep an eye on <b>Ottawa Blockchain</b> for the Founder Call date." },
    },
  },
});
</script>
</body>
</html>
