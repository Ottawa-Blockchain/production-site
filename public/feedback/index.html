<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Help shape the Ottawa Blockchain reboot. One minute, mostly taps.">
<meta property="og:title" content="Ottawa Blockchain is rebooting">
<meta property="og:description" content="Help us shape it. One minute, mostly taps.">
<meta property="og:image" content="https://ottawablockchain.ca/logo.png">
<title>Ottawa Blockchain: Help Shape the Reboot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#E8DED3" id="themecolor">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/logo.png">
<style>
  /* Ottawa Blockchain brand (from ottawablockchain.ca). Story-style: one full screen per question. */
  :root {
    --beige: #E8DED3; --neutral: #DFD5CC; --dark: #2C2C2C; --red: #CE3937; --red-dark: #b02e2c; --gold: #C8A44C;
    --bg: var(--beige); --fg: var(--dark); --muted: rgba(44,44,44,.62); --rule: rgba(44,44,44,.22);
    --sel-bg: var(--dark); --sel-fg: #fff; --btn-bg: var(--red); --btn-fg: #fff; --seg: rgba(44,44,44,.16); --seg-on: var(--dark);
  }
  body[data-theme="red"] {
    --bg: var(--red-dark); --fg: #fff; --muted: rgba(255,255,255,.94); --rule: rgba(255,255,255,.55);
    --sel-bg: #fff; --sel-fg: var(--red-dark); --btn-bg: #fff; --btn-fg: var(--red-dark); --seg: rgba(255,255,255,.3); --seg-on: #fff;
  }
  html[data-mode="dark"] body {
    --bg: #1b1918; --fg: #EFE7DE; --muted: rgba(239,231,222,.62); --rule: rgba(239,231,222,.2);
    --sel-bg: #EFE7DE; --sel-fg: #1b1918; --btn-bg: var(--red); --btn-fg: #fff; --seg: rgba(239,231,222,.16); --seg-on: #EFE7DE;
  }
  html[data-mode="dark"] body[data-theme="red"] {
    --bg: #8e2523; --fg: #fff; --muted: rgba(255,255,255,.92); --rule: rgba(255,255,255,.5);
    --sel-bg: #fff; --sel-fg: #8e2523; --btn-bg: #fff; --btn-fg: #8e2523; --seg: rgba(255,255,255,.28); --seg-on: #fff;
  }
  html[data-mode="dark"] .hot { background: var(--red); }
  html[data-mode="dark"] body:not([data-theme="red"]) .teaser .chip { background: var(--gold); }
  .mode { background: none; border: 1.5px solid var(--rule); color: var(--fg); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
  .mode svg { width: 16px; height: 16px; }
  .top-right { display: flex; align-items: center; gap: 12px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow-x: hidden; }
  html { -webkit-text-size-adjust: 100%; }
  button, a, input { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  body {
    font-family: "Satoshi", "Inter", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--fg); transition: background .35s ease, color .35s ease;
    min-height: 100%; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* Story bars + brand row */
  header { width: 100%; max-width: 600px; padding: 12px 20px 0; position: sticky; top: 0; background: var(--bg); z-index: 2; transition: background .35s ease; }
  .segs { display: flex; gap: 4px; }
  .segs i { flex: 1; height: 3px; border-radius: 2px; background: var(--seg); overflow: hidden; position: relative; }
  .segs i.on::after { content: ""; position: absolute; inset: 0; background: var(--seg-on); }
  .segs i.now::after { animation: fill .45s ease forwards; }
  @keyframes fill { from { transform: translateX(-100%); } to { transform: none; } }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 4px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 900; letter-spacing: -0.02em; font-size: 15px; color: var(--fg); text-decoration: none; }
  .brand img { width: 22px; height: auto; transition: filter .35s; }
  body[data-theme="red"] .brand img { filter: brightness(0) invert(1); }
  .step-no { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums; }

  main { width: 100%; max-width: 600px; flex: 1; display: flex; }
  #app { flex: 1; display: flex; min-width: 0; }
  .card { width: 100%; display: flex; flex-direction: column; padding: 28px 20px 0; animation: slide .4s cubic-bezier(.2,.7,.2,1); }
  .card.back { animation-name: slideback; }
  @keyframes slide { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes slideback { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }

  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .hero-logo { width: 64px; height: auto; margin-bottom: 28px; filter: brightness(0) invert(1); }
  h1 { font-size: 48px; line-height: .98; letter-spacing: -0.04em; font-weight: 900; margin-bottom: 18px; }
  h2 { font-size: 34px; line-height: 1.04; letter-spacing: -0.035em; font-weight: 900; margin-bottom: 10px; }
  .sub { color: var(--muted); font-size: 17px; line-height: 1.45; margin-bottom: 26px; max-width: 30em; }
  .gap { height: 16px; }
  .hint { color: var(--muted); font-size: 14px; font-weight: 500; margin: -2px 0 20px; }

  .teaser { border-top: 1.5px solid var(--rule); border-bottom: 1.5px solid var(--rule); padding: 14px 0; margin-bottom: 28px; font-size: 15px; line-height: 1.4; display: flex; gap: 12px; align-items: baseline; }
  .teaser .chip { flex-shrink: 0; font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; background: var(--gold); color: var(--dark); padding: 4px 8px; border-radius: 4px; }
  .teaser b { font-weight: 700; }

  /* Answers: flat outlined rows, solid fill when picked */
  .opts { display: grid; gap: 8px; }
  .opts.two { grid-template-columns: 1fr 1fr; }
  .opt {
    display: flex; align-items: center; gap: 12px; min-height: 52px;
    background: transparent; color: var(--fg); border: 1.5px solid var(--rule); border-radius: 10px;
    padding: 13px 16px; font: inherit; font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
    cursor: pointer; text-align: left; transition: background .15s, color .15s, border-color .15s, transform .08s;
  }
  @media (hover: hover) { .opt:hover { border-color: var(--fg); } }
  .opt:active { transform: scale(.985); }
  .opt.on { background: var(--sel-bg); color: var(--sel-fg); border-color: var(--sel-bg); }
  .tile { width: 34px; height: 34px; flex-shrink: 0; border-radius: 9px; display: grid; place-items: center;
    color: var(--tint); background: color-mix(in srgb, var(--tint) 15%, transparent); transition: background .15s, color .15s; }
  .tile svg { width: 19px; height: 19px; }
  html[data-mode="dark"] .tile { color: color-mix(in srgb, var(--tint) 65%, #fff); background: color-mix(in srgb, var(--tint) 26%, transparent); }
  html[data-mode="dark"] .opt.on .tile { color: #fff; background: var(--tint); }
  .tile.plain { color: var(--fg); background: color-mix(in srgb, var(--fg) 9%, transparent); }
  .opt.on .tile { color: #fff; background: var(--tint); }
  .opt.on .tile.plain { color: var(--sel-bg); background: var(--sel-fg); }
  body[data-theme="red"] .tile { color: #fff; background: rgba(255,255,255,.16); }
  body[data-theme="red"] .opt.on .tile { color: #fff; background: var(--bg); }
  .pill .tile { width: 30px; height: 30px; margin-bottom: 4px; }
  .pill .tile svg { width: 17px; height: 17px; }
  .opt .e { width: 22px; flex-shrink: 0; display: grid; place-items: center; }
  .opt .e svg { width: 22px; height: 22px; }
  .opt .note { display: block; font-size: 13px; font-weight: 500; opacity: .7; margin-top: 2px; letter-spacing: 0; }
  .lbl-text { flex: 1; min-width: 0; }
  .tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .opt .right { margin-left: auto; display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
  .hot, .tag { font-size: 10px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; white-space: nowrap; }
  .hot { background: var(--red); color: #fff; }
  .opt.on .hot { background: #fff; color: var(--red); }
  .tag { border: none; opacity: 1; }
  .tag.v { background: #2F6FB0; color: #fff; }
  .tag.p { background: #C8A44C; color: #2C2C2C; }
  .legend .tag { font-size: 11px; padding: 4px 8px; }
  .rank { width: 24px; height: 24px; border-radius: 50%; background: var(--sel-fg); color: var(--sel-bg); font-size: 13px; font-weight: 900; display: grid; place-items: center; }
  .legend { display: flex; gap: 6px; flex-wrap: wrap; margin: -6px 0 18px; color: var(--muted); }

  .pills { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 22px; }
  .pills.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pill { min-width: 0; justify-content: center; flex-direction: column; gap: 2px; padding: 12px 2px; font-size: 14px; text-align: center; min-height: 52px; }
  .pill small { font-size: 11px; font-weight: 500; opacity: .7; }
  .socials { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .soc { padding: 12px; min-height: 48px; }
  .soc.on .e svg { fill: currentColor; }
  .grp { font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

  input[type=text], input[type=email] {
    width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--rule); border-radius: 0;
    padding: 12px 2px; font: inherit; font-size: 20px; font-weight: 700; color: var(--fg); outline: none;
  }
  input::placeholder { color: var(--muted); font-weight: 500; opacity: .7; }
  input:focus { border-bottom-color: var(--fg); }
  .detail { margin-top: 14px; }
  label.lbl { display: block; font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 22px 0 2px; }
  label.lbl:first-of-type { margin-top: 0; }

  /* Bottom bar stays in thumb reach */
  .nav { position: sticky; bottom: 0; margin-top: auto; padding: 18px 0 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: linear-gradient(to bottom, transparent, var(--bg) 30%); }
  .btn {
    font: inherit; font-weight: 900; font-size: 16px; border: none; cursor: pointer; background: var(--btn-bg); color: var(--btn-fg);
    padding: 15px 28px; border-radius: 50px; min-height: 52px; transition: background .2s, transform .08s;
  }
  @media (hover: hover) { .btn:hover { filter: brightness(.94); } }
  .btn:active { transform: scale(.97); }
  .btn[disabled] { opacity: .4; cursor: default; }
  .btn.ghost { background: transparent; color: var(--muted); padding: 15px 4px; }
  .btn.wide { width: 100%; }
  .count { color: var(--muted); font-size: 13px; font-weight: 700; }
  .err { color: var(--red); font-size: 14px; font-weight: 700; margin-top: 12px; }
  body[data-theme="red"] .err { color: #fff; }
  .card > .spacer { height: 12px; }
  body[data-theme="red"] .sub, body[data-theme="red"] .teaser, body[data-theme="red"] .hint { font-weight: 500; }
  body[data-theme="red"] .opt .note { opacity: .95; }
  body[data-theme="red"] .opt.on .note { opacity: .8; }
  body[data-theme="red"] .teaser .chip { background: #fff; color: var(--bg); }
  body[data-theme="red"] .kicker { color: #fff; }
  footer { display: none; }

  @media (min-width: 700px) {
    .card { padding-top: 7vh; }
    h1 { font-size: 64px; } h2 { font-size: 40px; }
  }
  @media (max-width: 380px) {
    h1 { font-size: 42px; } h2 { font-size: 29px; }
    .card { padding: 22px 16px 0; } header { padding: 10px 16px 0; }
    .opts.two { grid-template-columns: 1fr; }
    .opt { min-height: 48px; padding: 11px 14px; font-size: 15px; }
    .pills { gap: 4px; } .pill { font-size: 12.5px; }
  }
  @media (max-width: 520px) { .opts.two { grid-template-columns: 1fr; } }
</style>
</head>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const visible = () => STEPS.filter(s => !s.when || s.when(answers));
const extras = o => o[2] || {};
const isEmail = v => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
const icon = e => ICONS[e] ? `<svg viewBox="0 0 24 24" fill="${e === "x" ? "currentColor" : ICONS[e].c}" aria-hidden="true"><path d="${ICONS[e].d}"/></svg>` : e;

function go(delta) {
  stash();
  const list = visible();
  const cur = list.indexOf(STEPS[i]);
  dir = delta;
  i = STEPS.indexOf(list[Math.max(0, Math.min(list.length - 1, cur + delta))]);
  render();
}

// Save whatever is typed into any text box on the current card
function stash() {
  app.querySelectorAll("input[data-key]").forEach(el => { answers[el.dataset.key] = el.value.trim(); });
}

function optHTML(s, o, picked) {
  const [e, v] = o, x = extras(o);
  const n = picked.indexOf(v);
  const right = [
    x.hot ? `<span class="hot">Hot</span>` : "",
    s.ranked && n >= 0 ? `<span class="rank">${n + 1}</span>` : "",
  ].join("");
  return `<button class="opt ${n >= 0 ? "on" : ""}" data-v="${esc(v)}">
    ${ICONS[e] ? `<span class="e">${icon(e)}</span>` : tile(v)}
    <span class="lbl-text">${esc(v)}${x.note ? `<span class="note">${esc(x.note)}</span>` : ""}${x.tags ? `<span class="tags">${x.tags.map(t => `<span class="tag ${t}">${TAGS[t]}</span>`).join("")}</span>` : ""}</span>
    ${right ? `<span class="right">${right}</span>` : ""}</button>`;
}

// Text box for the selected option that asks for more detail ("Other")
function detailHTML(s, picked) {
  const o = s.opts.find(o => picked.includes(o[1]) && extras(o).ask);
  if (!o) return "";
  const key = s.id + "_other";
  return `<div class="detail"><input type="text" data-key="${key}" placeholder="${esc(extras(o).ask)}" value="${esc(answers[key] || "")}"></div>`;
}

function render() {
  const list = visible();
  const s = STEPS[i];
  const pos = list.indexOf(s);
  document.body.dataset.theme = s.theme || "light";
  const qs = list.filter(x => x.type !== "intro" && x.type !== "done");
  const qi = qs.indexOf(s);
  $("segs").innerHTML = qs.map((x, k) => `<i class="${k < qi || s.type === "done" ? "on" : ""}${k === qi ? " on now" : ""}"></i>`).join("");
  $("stepno").textContent = qi >= 0 ? `${String(qi + 1).padStart(2, "0")} / ${String(qs.length).padStart(2, "0")}` : "";
  const back = pos > 0 && s.type !== "done" ? `<button class="btn ghost" id="back">← Back</button>` : "<span></span>";
  let html = "";

  if (s.type === "intro") {
    html = `
      <img class="hero-logo" src="${LOGO}" alt="Ottawa Blockchain">
      <p class="kicker">Community survey · 1 minute</p>
      <h1>Ottawa Blockchain is rebooting.</h1>
      <p class="sub">Help us shape it. A few taps on what you care about and what you'd actually show up for. You don't need to be in Ottawa.</p>
      <div class="teaser"><span class="chip">Coming up</span><div><b>Our first virtual Founder Call.</b> Fill this out and you'll be first to hear.</div></div>
      <div class="nav"><button class="btn wide" id="next">Let's go →</button></div>`;

  } else if (s.type === "single" || s.type === "multi") {
    const multi = s.type === "multi";
    const picked = [].concat(answers[s.id] || []);
    const needsText = s.opts.some(o => picked.includes(o[1]) && extras(o).ask);
    const legend = s.opts.some(o => extras(o).tags)
      ? `<div class="legend">${Object.entries(TAGS).map(([k, t]) => `<span class="tag ${k}">${t}</span>`).join("")}</div>` : "";
    html = `
      <h2>${esc(s.q)}</h2>
      ${s.sub ? `<p class="sub">${esc(s.sub)}</p>` : `<div class="gap"></div>`}
      ${s.hint ? `<p class="hint">${esc(s.hint)}</p>` : ""}
      ${legend}
      <div class="opts ${s.opts.length > 4 && !legend ? "two" : ""}">${s.opts.map(o => optHTML(s, o, picked)).join("")}</div>
      ${detailHTML(s, picked)}
      <div class="nav">${back}
        ${multi
          ? `<span class="count">${picked.length ? picked.length + " picked" + (s.max ? " of " + s.max : "") : ""}</span><button class="btn" id="next">${picked.length ? "Next →" : "Skip →"}</button>`
          : (picked.length || needsText ? `<button class="btn" id="next">Next →</button>` : "")}
      </div>`;

  } else if (s.type === "when") {
    const on = (k, v) => (answers[k] || []).includes(v) ? "on" : "";
    const any = (answers.days || []).length || (answers.times || []).length;
    html = `
      <h2>${esc(s.q)}</h2><div class="gap"></div>
      <p class="hint">${esc(s.hint)}</p>
      <div class="grp">Days</div>
      <div class="pills">${DAYS.map(d => `<button class="opt pill ${on("days", d)}" data-k="days" data-v="${d}">${d}</button>`).join("")}</div>
      <div class="grp">Time of day</div>
      <div class="pills three">${TIMES.map(([t, e, r]) => `<button class="opt pill ${on("times", t)}" data-k="times" data-v="${t}">${tile(t)}${t}<small>${r}</small></button>`).join("")}</div>
      <div class="nav">${back}<button class="btn" id="next">${any ? "Next →" : "Skip →"}</button></div>`;

  } else if (s.type === "contact") {
    html = `
      <p class="kicker">Volunteer</p>
      <h2>Awesome. How do we reach you?</h2>
      <p class="sub">Fill in what you're comfortable with.</p>
      <label class="lbl">Name</label>
      <input type="text" data-key="name" placeholder="Your name" value="${esc(answers.name || "")}">
      <label class="lbl">Email</label>
      <input type="email" data-key="email" placeholder="you@email.com" value="${esc(answers.email || "")}">
      <label class="lbl">Best social to reach you on</label>
      <div class="socials">${SOCIALS.map(([k, n]) => `<button class="opt soc ${answers.social === n ? "on" : ""}" data-soc="${n}" title="${n}" aria-label="${n}"><span class="e">${icon(k)}</span></button>`).join("")}</div>
      ${answers.social ? `<input type="text" data-key="social_handle" placeholder="Your ${esc(answers.social)} handle or link" value="${esc(answers.social_handle || "")}">` : ""}
      <div id="msg"></div>
      <div class="nav">${back}<button class="btn" id="next">Next →</button></div>`;

  } else if (s.type === "newsletter") {
    const have = isEmail(answers.email || "");
    html = `
      <p class="kicker">Last one</p>
      <h2>Want the newsletter?</h2>
      <p class="sub">A monthly roundup of the latest news, on Substack. Optional.</p>
      ${have
        ? `<div class="opts">
             <button class="opt ${answers.newsletter === "Yes" ? "on" : ""}" data-nl="Yes"><span>Yes, send it to ${esc(answers.email)}</span></button>
             <button class="opt ${answers.newsletter === "No" ? "on" : ""}" data-nl="No"><span>No thanks</span></button>
           </div>`
        : `<input type="email" data-key="email" placeholder="you@email.com (optional)" value="${esc(answers.email || "")}">`}
      <div id="msg"></div>
      <div class="nav">${back}<button class="btn" id="submit">Send it →</button></div>`;

  } else if (s.type === "done") {
    html = `
      <img class="hero-logo" src="${LOGO}" alt="">
      <p class="kicker">Done</p>
      <h1>Thanks.<br>You're in.</h1>
      <p class="sub">We'll share what everyone said, and you'll be first to hear about the Founder Call.</p>
      <div class="teaser"><span class="chip">Next</span><div>Keep an eye on <b>Ottawa Blockchain</b> for the Founder Call date.</div></div>
      ${ENDPOINT ? "" : `<p class="count">Preview mode: this response was not saved.</p>`}`;
  }

  app.innerHTML = `<div class="card ${dir < 0 ? "back" : ""}">${html}</div>`;
  window.scrollTo(0, 0);
  if (typeof paintBar === "function") paintBar();
  wire(s);
}

function wire(s) {
  $("back") && ($("back").onclick = () => go(-1));
  $("next") && ($("next").onclick = () => {
    if (s.type === "contact") {
      stash();
      if (answers.email && !isEmail(answers.email)) { $("msg").innerHTML = `<p class="err">That email doesn't look right.</p>`; return; }
    }
    go(1);
  });
  $("submit") && ($("submit").onclick = submit);

  // Focus a freshly revealed text box
  const box = app.querySelector(".detail input, input[data-key=social_handle]");
  if (box && !box.value) box.focus();

  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    stash();
    const v = b.dataset.v;

    if (b.dataset.nl) { answers.newsletter = b.dataset.nl; return render(); }
    if (b.dataset.soc) {
      if (answers.social !== b.dataset.soc) answers.social_handle = "";
      answers.social = answers.social === b.dataset.soc ? "" : b.dataset.soc;
      return render();
    }

    if (b.dataset.k) { // day / time pills
      const arr = answers[b.dataset.k] || [];
      const k = arr.indexOf(v);
      k >= 0 ? arr.splice(k, 1) : arr.push(v);
      answers[b.dataset.k] = arr;
      return render();
    }

    const o = s.opts.find(o => o[1] === v);
    if (s.type === "multi") {
      const arr = answers[s.id] || [];
      const k = arr.indexOf(v);
      if (k >= 0) { arr.splice(k, 1); if (extras(o).ask) delete answers[s.id + "_other"]; }
      else if (!s.max || arr.length < s.max) arr.push(v);
      answers[s.id] = arr;
      return render();
    }

    // single choice
    if (answers[s.id] !== v) delete answers[s.id + "_other"];
    answers[s.id] = v;
    if (s.id === "volunteer" && v === "Not right now") { delete answers.help; delete answers.help_other; delete answers.camera; }
    render();
    if (!extras(o).ask) setTimeout(() => go(1), 220); // auto-advance unless we need them to type
  });
}

async function submit() {
  stash();
  const btn = $("submit"), msg = $("msg");
  if (answers.email && !isEmail(answers.email)) { msg.innerHTML = `<p class="err">That email doesn't look right.</p>`; return; }
  if (answers.email && !answers.newsletter && !isVolunteer(answers)) answers.newsletter = "Yes";
  btn.disabled = true; btn.textContent = "Sending…";

  const join = k => [].concat(answers[k] || []).join(", ");
  const row = { timestamp: new Date().toISOString() };
  STEPS.filter(s => s.opts).forEach(s => {
    if (!s.when || s.when(answers)) { row[s.id] = join(s.id); row[s.id + "_other"] = answers[s.id + "_other"] || ""; }
  });
  // Ranked answers: "1. Founder & guest talks, 2. News roundup"
  row.kinds = (answers.kinds || []).map((v, n) => `${n + 1}. ${v}`).join(", ");
  if (!isVolunteer(answers)) { answers.name = answers.social = answers.social_handle = ""; }
  Object.assign(row, {
    days: join("days"), times: join("times"),
    name: answers.name || "", email: answers.email || "",
    social: answers.social || "", social_handle: answers.social_handle || "",
    newsletter: answers.newsletter || "No",
  });

  if (ENDPOINT) {
    try {
      // text/plain avoids a CORS preflight; Apps Script reads the raw body
      await fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(row) });
    } catch (e) {
      btn.disabled = false; btn.textContent = "Send it →";
      msg.innerHTML = `<p class="err">Couldn't send. Check your connection and try again.</p>`;
      return;
    }
  }
  i = STEPS.findIndex(s => s.id === "done");
  render();
}

// Light / dark mode. The button cycles Auto (follows the phone) -> Light -> Dark, and remembers the choice.
const ICON_AUTO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const MODES = { auto: [ICON_AUTO, "Auto (matches your device)"], light: [ICON_SUN, "Light"], dark: [ICON_MOON, "Dark"] };
const darkQuery = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
let pref = "auto";
try { pref = localStorage.getItem("obc-mode") || "auto"; } catch (e) {}
if (!MODES[pref]) pref = "auto";
function applyMode() {
  const m = pref === "auto" ? (darkQuery && darkQuery.matches ? "dark" : "light") : pref;
  document.documentElement.dataset.mode = m;
  const btn = $("mode");
  btn.innerHTML = MODES[pref][0];
  btn.title = "Theme: " + MODES[pref][1];
  btn.setAttribute("aria-label", "Theme: " + MODES[pref][1] + ". Tap to change.");
  paintBar();
}
function paintBar() {
  const c = getComputedStyle(document.body).getPropertyValue("--bg").trim();
  if (c) $("themecolor").setAttribute("content", c);
}
$("mode").onclick = () => {
  pref = { auto: "light", light: "dark", dark: "auto" }[pref];
  try { localStorage.setItem("obc-mode", pref); } catch (e) {}
  applyMode();
};
darkQuery && darkQuery.addEventListener && darkQuery.addEventListener("change", () => { if (pref === "auto") applyMode(); });
applyMode();

render();
</script>
</body>
</html>
